{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<div class="container-sm">
  <div class="card" style="margin-top: 2rem;">
    <div style="text-align:center; margin-bottom:1.5rem;">
      <div style="width:48px;height:48px;background:linear-gradient(135deg,var(--purple),var(--blue));border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:1rem;">⚙️</div>
      <h2 style="font-size:1.25rem; font-weight:700;">Admin Login</h2>
      <p style="color:var(--text2); font-size:0.85rem; margin-top:0.25rem;">Enter admin password to continue</p>
    </div>

    <form method="POST">
      <div class="form-group">
        <label>Admin Password</label>
        <input type="password" name="password" placeholder="••••••••" required autofocus/>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Login</button>
    </form>

    <div style="text-align:center; margin-top:1rem;">
      <a href="{{ url_for('index') }}" class="link">← Back to Home</a>
    </div>
  </div>
</div>
{% endblock %}
