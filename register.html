{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="container-sm">
  <div class="card" style="margin-top:2rem;">
    <div style="text-align:center; margin-bottom:1.5rem;">
      <div style="width:48px;height:48px;background:linear-gradient(135deg,var(--green),var(--blue));border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:1rem;">📝</div>
      <h2 style="font-size:1.25rem; font-weight:700;">Voter Registration</h2>
      <p style="color:var(--text2); font-size:0.85rem; margin-top:0.25rem;">Create a new voter account</p>
    </div>

    <form method="POST">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="name" placeholder="Your full name" required autofocus/>
      </div>
      <div class="form-group">
        <label>Voter ID</label>
        <input type="text" name="voter_id" placeholder="Choose a unique voter ID" required/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Create a password" required/>
      </div>
      <button type="submit" class="btn btn-green btn-full">Register</button>
    </form>

    <div style="text-align:center; margin-top:1rem; display:flex; justify-content:space-between;">
      <a href="{{ url_for('voter_login') }}" class="link">Already registered? Login →</a>
      <a href="{{ url_for('index') }}" class="link">← Home</a>
    </div>
  </div>
</div>
{% endblock %}
